<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}polar-flow-server{% endblock %}</title>
    <!-- Vendored assets (#71): served locally so a self-hosted install works
         offline and no third-party CDN can inject code into the admin panel.
         htmx.min.js / chart.umd.js are byte-identical to the previously
         SRI-pinned CDN builds; tailwind.css is built statically from the
         templates (see docs/frontend-assets.md). -->
    <script src="/static/vendor/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/vendor/tailwind.css">
    <script>
        // Configure HTMX to include CSRF token from cookie in all requests
        document.addEventListener('htmx:configRequest', function(event) {
            // Read CSRF token from cookie
            const csrfToken = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrf_token='))
                ?.split('=')[1];
            if (csrfToken) {
                event.detail.headers['X-CSRF-Token'] = csrfToken;
            }
        });
    </script>
    <script src="/static/vendor/chart.umd.js"></script>
    <!-- date-fns chart adapter dropped: no chart uses a time scale -->
    <style>
        [x-cloak] { display: none !important; }
        /* Always reserve space for the vertical scrollbar so switching between
           tabs of different content height (e.g. dashboard tabs) doesn't shift
           the whole page horizontally when the scrollbar appears/disappears. */
        html {
            scrollbar-gutter: stable;
            overflow-y: scroll;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
