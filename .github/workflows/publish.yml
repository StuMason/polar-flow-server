name: Publish Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: stumason/polar-flow-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Decide which tags to push
        id: tags
        run: |
          # This workflow runs on every push to main, but the version only
          # moves on a release. Only push the version tag the first time we
          # see it, so a pinned tag never silently changes underneath users.
          # A Docker Hub lookup hiccup falls open to pushing both tags.
          VERSION=${{ steps.version.outputs.version }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS="$IMAGE:latest"
          if curl -sf --max-time 30 "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/$VERSION" >/dev/null; then
            echo "Docker Hub already has $VERSION; pushing latest only"
          else
            echo "Pushing latest and $VERSION"
            TAGS="$TAGS"$'\n'"$IMAGE:$VERSION"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcp-registry:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write # OIDC auth to the MCP registry
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip if this version is already in the registry
        id: check
        run: |
          # A lookup hiccup must not kill the release — treat as "not yet published"
          LATEST=$(curl -s --max-time 30 "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.StuMason/polar-flow-server" \
            | jq -r '.servers[] | select(.server.name == "io.github.StuMason/polar-flow-server") | .server.version' | head -1 || true)
          echo "Registry has: ${LATEST:-nothing}; building: ${{ steps.version.outputs.version }}"
          if [ "$LATEST" = "${{ steps.version.outputs.version }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Install mcp-publisher
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = "docker.io/stumason/polar-flow-server:" + $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        if: steps.check.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.check.outputs.skip != 'true'
        run: |
          # Docker Hub propagation can lag right after push — retry a few times.
          # This job runs on every push to main but the version only changes on
          # a release, so if the lookup above timed out and we get here with a
          # version the registry already has, that is a no-op, not a failure.
          for i in 1 2 3; do
            if out=$(./mcp-publisher publish 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if grep -q "duplicate version" <<<"$out"; then
              echo "Version already in the registry - nothing to publish"
              exit 0
            fi
            echo "Registry publish attempt $i failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          exit 1
